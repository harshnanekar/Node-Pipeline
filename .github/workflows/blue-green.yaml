name: BLUE_GREEN_PIPELINE

on:
  workflow_run:
    workflows: ["DOCKER_PIPELINE"]
    types: [completed]
    branches: [main]

concurrency:
  group: blue-green-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-green:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Detect live environment
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="/etc/nginx/sites-available/blue-green"

          if grep -q 'proxy_pass http://127.0.0.1:3001;' "$CONFIG"; then
            echo "live=blue" >> "$GITHUB_OUTPUT"
            echo "target=green" >> "$GITHUB_OUTPUT"
            echo "port=3002" >> "$GITHUB_OUTPUT"
          elif grep -q 'proxy_pass http://127.0.0.1:3002;' "$CONFIG"; then
            echo "live=green" >> "$GITHUB_OUTPUT"
            echo "target=blue" >> "$GITHUB_OUTPUT"
            echo "port=3001" >> "$GITHUB_OUTPUT"
          else
            echo "Could not determine live environment"
            exit 1
          fi

      - name: Deploy Docker image to inactive environment
        shell: bash
        env:
          TARGET: ${{ steps.detect.outputs.target }}
          PORT: ${{ steps.detect.outputs.port }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail

          IMAGE="${DOCKER_USER}/node-pipeline:${IMAGE_TAG}"
          CONTAINER="node-pipeline-${TARGET}"

          docker pull "$IMAGE"
          docker rm -f "$CONTAINER" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p "127.0.0.1:${PORT}:3000" \
            -e APP_VERSION="${IMAGE_TAG:0:7}" \
            "$IMAGE"

      - name: Health check inactive environment
        shell: bash
        env:
          PORT: ${{ steps.detect.outputs.port }}
          TARGET: ${{ steps.detect.outputs.target }}
        run: |
          set -euo pipefail

          for i in {1..15}; do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null; then
              echo "$TARGET is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed; traffic has not been switched"
          exit 1

      - name: Switch traffic
        shell: bash
        env:
          TARGET: ${{ steps.detect.outputs.target }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/switch-blue-green "$TARGET"

      - name: Verify live traffic
        shell: bash
        env:
          EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          EXPECTED="${EXPECTED_VERSION:0:7}"

          for i in {1..10}; do
            RESPONSE=$(curl -fsS http://127.0.0.1:3000/version) || {
              sleep 2
              continue
            }

            if echo "$RESPONSE" | grep -q "\"version\":\"$EXPECTED\""; then
              echo "Deployment verified: $RESPONSE"
              exit 0
            fi

            sleep 2
          done

          echo "Live traffic verification failed"
          exit 1

      - name: Roll back traffic on failure
        if: failure()
        shell: bash
        env:
          PREVIOUS_ENV: ${{ steps.detect.outputs.live }}
        run: |
          set -euo pipefail

          echo "A deployment step failed. Restoring traffic to $PREVIOUS_ENV."

          sudo -n /usr/local/sbin/switch-blue-green "$PREVIOUS_ENV"

          echo "Checking the previous live environment..."
          curl --retry 5 --retry-delay 2 --retry-connrefused \
            --fail http://127.0.0.1:3000/health

          echo "Rollback completed; previous environment is responding now."