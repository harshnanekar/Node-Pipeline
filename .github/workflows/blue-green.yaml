name: "BLUE_GREEN_PIPELINE"

on:
  workflow_run:
    workflows: ["NODE_PIPELINE"]
    types:
      - completed

jobs:
  deploy-green:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Green
        run: |
          cd "$HOME/projects/Node Pipeline"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          npm ci
          PORT=3002 APP_VERSION=green pm2 restart green --update-env

      - name: Health check Green
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:3002/health; then
              echo "Green is healthy!"
              exit 0
            fi
            sleep 2
          done

          echo "Green health check failed!"
          exit 1

        
      - name: Switch traffic to Green
        run: |
          sudo sed -i 's|proxy_pass http://127.0.0.1:3001;|proxy_pass http://127.0.0.1:3002;|' /etc/nginx/sites-available/blue-green

          sudo nginx -t
          sudo service nginx reload

          echo "Traffic switched to Green!"
