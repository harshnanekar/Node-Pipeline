name: NODE_PIPELINE

on:
  push

env:
  NODE_ENV: development-test
  API_KEY: ${{ secrets.API_KEY }}

jobs:
    Run:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install Dependencies
              run: npm install

            # - name: Run Tests
            #   run: npm test

            - name: Run Project
              run: node index.js
              



            
