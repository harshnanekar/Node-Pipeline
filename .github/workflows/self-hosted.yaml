name: "SELF_HOSTED_PIPELINE"

on:
  workflow_run:
    workflows: ["NODE_PIPELINE"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Prepare deployment
        run: |
          cd ~/projects/"Node Pipeline"

          # Remember the currently deployed commit
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "PREVIOUS_COMMIT=$PREVIOUS_COMMIT" >> "$GITHUB_ENV"

          # Remove local changes and sync with GitHub
          git reset --hard
          git clean -fd
          git fetch origin main
          git reset --hard origin/main

          echo "Deployed commit:"
          git rev-parse HEAD

      - name: Install dependencies
        run: |
          cd ~/projects/"Node Pipeline"
          npm ci

      - name: Restart application
        run: |
          pm2 restart node-pipeline
          sleep 2

      - name: Check application status
        run: |
          cd ~/projects/"Node Pipeline"

          if curl -fsS http://localhost:3000/health; then
            echo "Deployment successful"
          else
            echo "Health check failed!"
            echo "Rolling back to $PREVIOUS_COMMIT"

            git reset --hard "$PREVIOUS_COMMIT"

            npm ci

            pm2 restart node-pipeline

            echo "Rollback completed."

            exit 1
          fi